#   prefix: "2iddtmm2:"
#   labels: ["tetramm"]

mic_common.devices.ad_fileplugin.DetNetCDF:
- name: xrf_netcdf
  prefix: "2iddXMAP:netCDF1:"
  labels: ["netcdf"]

mic_common.devices.ad_fileplugin.DetHDF5:
- name: tmm1_hdf
  prefix: "2iddtmm1:HDF1:"
  labels: ["fileplugin"]

