# Guarneri-style device YAML configuration

mic_common.devices.scan_record.NewScanRecord:
- name: scan1
  prefix: "2idd:scan1"
  labels: ["scanrecord"]
- name: scan2
  prefix: "2idd:scan2"
  labels: ["scanrecord"]
- name: fscan1
  prefix: "2idd:Fscan1"
  labels: ["scanrecord"]
- name: fscanh
  prefix: "2idd:FscanH"
  labels: ["scanrecord"]

mic_common.devices.save_data.SaveDataMic:
- name: savedata
  prefix: "2idd:saveData_"
  labels: ["savedata"]

s2idd_uprobe.devices.motor.Motor:
- name: samx
  prefix: 2idd:m40
  labels: ["motor"]
- name: samy
  prefix: 2idd:m39
  labels: ["motor"]
- name: samz
  prefix: 2idd:m36
  labels: ["motor"]
- name: zp_z
  prefix: 2idd:m44
  labels: ["motor"]

ophyd.EpicsSignal:
- name: fscanh_samx
  write_pv: 2iddfS1:ExtrauserCalc13.A
  read_pv: 2iddfS1:ExtrauserCalc13.A
  labels: ["usercalc"]
- name: fscanh_dwell
  write_pv: 2idd:Flyscans:Setup:DwellTime
  read_pv: 2idd:Flyscans:Setup:DwellTime
  labels: ["usercalc"]
- name: fly_calc
  write_pv: 2iddfS1:userCalcEnable.VAL
  read_pv: 2iddfS1:userCalcEnable.VAL
  labels: ["usercalc"]
- name: usercalc_samx_speed
  write_pv: 2iddfS1:userCalc8Enable
  read_pv: 2iddfS1:userCalc8Enable
  labels: ["usercalc"]
- name: retrace_samx_passive
  write_pv: 2iddfS1:userCalc8.SCAN
  read_pv: 2iddfS1:userCalc8.SCAN
  labels: ["usercalc"]

mic_common.devices.sis3820.SIS3820:
- name: sis3820
  prefix: 2idd:3820
  labels: ["sis3820"]

s2idd_uprobe.devices.kohzu.KohzuMono:
- name: kohzu_mono
  prefix: "2ida2:"
  labels: ["mono"]

mic_common.devices.xmap.XMAP:
- name: xrf
  prefix: 2iddXMAP
  labels: ["xmap"]

s2idd_uprobe.devices.tetramm.MicTetrAMM:
- name: tmm1
  prefix: "2iddtmm1:"
  labels: ["tetramm"]
