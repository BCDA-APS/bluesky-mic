existing_plans:
  fly2d:
    description: Execute a 2D flyscan over a rectangular area without using Scan Record.
    module: s2idd_uprobe.plans.fly2d
    name: fly2d
    parameters:
    - default: '''smp1'''
      description: 'The name of the sample for file naming. Default: "smp1". Type:
        str'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - default: ''''''
      description: 'User comments to be recorded with the scan data. Default is "".
        Type: str'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - default: '0'
      description: 'The total width of the scan area in microns. Default: 0. Type:
        float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width
    - default: None
      description: 'The center position of the scan in the x-direction in microns.
        If not provided, the current x-motor position will be used as the center.
        Default: None. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center
    - default: '0'
      description: 'The step size (spatial resolution) in the x-direction in microns.
        Default: 0. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x
    - default: '0'
      description: 'The total height of the scan area in microns. Default: 0. Type:
        float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height
    - default: None
      description: 'The center position of the scan in the y-direction in microns.
        If not provided, the current y-motor position will be used as the center.
        Default: None. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_center
    - default: '0'
      description: 'The step size (spatial resolution) in the y-direction in microns.
        Default: 0. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y
    - default: '0'
      description: 'The dwell time per step in milliseconds. Default: 0. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms
    - default: None
      description: 'The sample z position in millimeters. If not provided, the current
        sample z position will be maintained. Default: None. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: sample_z
    - default: None
      description: 'The increment in energy (currently not implemented). Default:
        None. Type: float'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: inc_eng
    - default: 'False'
      description: 'Whether to adjust the zero point (currently not implemented).
        Default: False. Type: bool'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: adjust_zp
    - default: 'False'
      description: 'Whether to enable preamp2. Default is False. Type: bool'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: preamp2_on
    - default: 'True'
      description: 'Whether to enable preamp1. Preamp1 is used to record metadata.
        Default is True. Type: bool'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: preamp1_on
    - default: 'True'
      description: 'Whether to enable the x-ray fluorescence detector. Default is
        True. Type: bool'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xrf_on
    - default: 'False'
      description: 'Whether to use snake scan pattern (alternating scan directions).
        When False, standard raster scan. Default is False. Type: bool'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: snake_scan
    properties:
      is_generator: true
  fly2d_scanrecord:
    description: 2D Bluesky plan that drives the x- and y- sample motors in fly mode
      using ScanRecord
    module: s2idd_uprobe.plans.fly2d_scanrecord
    name: fly2d_scanrecord
    parameters:
    - annotation:
