existing_plans:
  adaptive_scan:
    description: Scan over one variable with adaptively tuned step size.
    module: bluesky.plans
    name: adaptive_scan
    parameters:
    - annotation:
        type: collections.abc.Sequence[__READABLE__]
      convert_device_names: true
      description: list of 'readable' objects
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: detectors
    - annotation:
        type: str
      description: data field whose output is the focus of the adaptive tuning
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: target_field
    - annotation:
        type: __MOVABLE__
      convert_device_names: true
      description: any 'settable' object (motor, temp controller, etc.)
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: motor
    - annotation:
        type: float
      description: starting position of motor
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: start
    - annotation:
        type: float
      description: ending position of motor
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stop
    - annotation:
        type: float
      description: smallest step for fast-changing regions
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: min_step
    - annotation:
        type: float
      description: largest step for slow-changing regions
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: max_step
    - annotation:
        type: float
      description: desired fractional change in detector signal between steps
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: target_delta
    - annotation:
        type: bool
      description: whether backward steps are allowed -- this is concern with some
        motors
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: backstep
    - annotation:
        type: typing.Optional[float]
      default: '0.8'
      description: threshold for going backward and rescanning a region, default is
        0.8
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: threshold
    - annotation:
        type: typing.Optional[dict[str, typing.Any]]
      default: None
      description: metadata
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: md
    properties:
      is_generator: true
  count:
    description: Take one or more readings from detectors.
    module: bluesky.plans
    name: count
    parameters:
    - annotation:
        type: collections.abc.Sequence[__READABLE__]
      convert_device_names: true
      description: list of 'readable' objects
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: detectors
    - annotation:
        type: typing.Optional[int]
      default: '1'
      description: 'number of readings to take; default is 1


        If None, capture data until canceled'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: num
    - annotation:
        type: typing.Union[float, collections.abc.Iterable[float]]
      default: '0.0'
      description: Time delay in seconds between successive readings; default is 0.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: delay
    - default: None
      description: "hook for customizing action of inner loop (messages per step)\n\
        Expected signature ::\n\n   def f(detectors: Iterable[OphydObj]) -> Generator[Msg]:\n\
        \       ..."
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: per_shot
    - annotation:
        type: typing.Optional[dict[str, typing.Any]]
      default: None
      description: metadata
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: md
    properties:
      is_generator: true
  fly:
    description: Perform a fly scan with one or more 'flyers'.
    module: bluesky.plans
    name: fly
    parameters:
    - annotation:
        type: list[__FLYABLE__]
      convert_device_names: true
      description: objects that support the flyer interface
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: flyers
    - annotation:
        type: typing.Optional[dict[str, typing.Any]]
      default: None
      description: metadata
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: md
    properties:
      is_generator: true
  fly2d:
    description: "2D Bluesky plan that drives the x- and y- sample motors in flying\
      \ mode\nThe plan will drive samx and samy to the requested x_center and y_center,\
      \ \nand then perform a relative scan in the x and y directions."
    module: isn.plans.fly2d
    name: fly2d
    parameters:
    - annotation:
        type: str
      default: '''smp1'''
      description: 'The name of the sample. Type: str. Default: "smp1".'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - annotation:
        type: str
      default: ''''''
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - annotation:
        type: float
      default: None
      description: 'The center of the scan in the x direction. Type: float. Default:
        None which uses the current position of samx'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center
    - annotation:
        type: float
      default: None
      description: 'The center of the scan in the y direction. Type: float. Default:
        None which uses the current position of samy'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_center
    - annotation:
        type: float
      default: '0'
      description: 'The width of the scan in mm. Type: float. Default: 0.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width
    - annotation:
        type: float
      default: '0'
      description: 'The height of the scan in mm. Type: float. Default: 0.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height
    - annotation:
        type: float
      default: '0.1'
      description: 'The step size in the x direction in um. Type: float. Default:
        0.1.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x
    - annotation:
        type: float
      default: '0.1'
      description: 'The step size in the y direction in um. Type: float. Default:
        0.1.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y
    - annotation:
        type: float
      default: '0'
      description: 'The dwell time in the scan in ms. Type: float. Default: 0.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms
    - annotation:
        type: int
      default: '5'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: num_interferometer_per_pixel
    - annotation:
        type: float
      default: '0.01'
      description: 'The detector dead time in the scan in ms. Type: float. Default:
        0.01.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: det_dead_ms
    - annotation:
        type: bool
      default: 'True'
      description: 'Whether to collect XRF data. Type: bool. Default: True.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xrf_on
    - annotation:
        type: bool
      default: 'True'
      description: 'Whether to collect TMM data. Type: bool. Default: True.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: tmm_on
    - annotation:
        type: bool
      default: 'False'
      description: 'Whether to collect Ptycho data. Type: bool. Default: False.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: ptycho_on
    properties:
      is_generator: true
  flyscan:
    module: isn.plans.flyscan
    name: flyscan
    parameters:
    - kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: detectors
    - annotation:
        type: float
      default: '-50'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_min
    - annotation:
        type: float
      default: '50'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_max
    - annotation:
        type: int
      default: '11'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_npts
    - annotation:
        type: float
      default: '0'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_min
    - annotation:
        type: float
      default: '90'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_max
    - annotation:
        type: int
      default: '11'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_npts
    - annotation:
        type: float
      default: '80'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: acquire_time
    - annotation:
        type: float
      default: '20'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: det_dead
    - annotation:
        type: float
      default: '0.9'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: F
    - annotation:
        type: int
      default: '1000'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: interferometer_frequency
    properties:
      is_generator: true
  grid_scan:
    description: Scan over a mesh; each motor is on an independent trajectory.
    module: bluesky.plans
    name: grid_scan
    parameters:
    - annotation:
        type: collections.abc.Sequence[__READABLE__]
      convert_device_names: true
      description: list of 'readable' objects
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: detectors
    - kind:
        name: VAR_POSITIONAL
        value: 2
      name: args
    - annotation:
        type: typing.Union[collections.abc.Iterable[typing.Any], bool, NoneType]
      default: None
      description: 'which axes should be snaked, either ``False`` (do not snake any
        axes),

        ``True`` (snake all axes) or a list of axes to snake. "Snaking" an axis

        is defined as following snake-like, winding trajectory instead of a

        simple left-to-right trajectory. The elements of the list are motors

        that are listed in `args`. The list must not contain the slowest

        (first) motor, since it can''t be snaked.'
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: snake_axes
    - default: None
      description: 'hook for customizing action of inner loop (messages per step).

        See docstring of :func:`bluesky.plan_stubs.one_nd_step` (the default)

        for details.'
      kind:
        name: KEYWORD_ONLY
        value: 3
      name: per_step
    - annotation:
        type: typing.Optional[dict[str, typing.Any]]
