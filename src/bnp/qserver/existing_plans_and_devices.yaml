existing_plans:
  coarse_fine_scanrecord:
    description: This plan runs a coarse fly2d scan, compute a fine center, then run
      a fine fly2d scan
    module: bnp.plans.coarse_fine_scanrecord
    name: coarse_fine_scanrecord
    parameters:
    - annotation:
        type: str
      default: '''smp1'''
      description: 'The name of the sample for file naming. Default: "smp1". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - annotation:
        type: str
      default: ''''''
      description: 'User comments to be recorded with the scan data. Default is "". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - annotation:
        type: float
      default: '0'
      description: 'The total width of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width
    - annotation:
        type: float
      default: None
      description: "The center position of the scan in the x-direction in microns.\
        \ If not provided, \nthe current x-motor position will be used as the center.\
        \ Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the x-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x
    - annotation:
        type: float
      default: '0'
      description: 'The total height of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height
    - annotation:
