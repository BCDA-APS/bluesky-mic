existing_plans:
  coarse_fine_scanrecord:
    description: This plan runs a coarse fly2d scan, compute a fine center, then run
      a fine fly2d scan
    module: bnp.plans.coarse_fine_scanrecord
    name: coarse_fine_scanrecord
    parameters:
    - annotation:
        type: str
      default: '''smp1'''
      description: 'The name of the sample for file naming. Default: "smp1". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - annotation:
        type: str
      default: ''''''
      description: 'User comments to be recorded with the scan data. Default is "". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - annotation:
        type: float
      default: '0'
      description: 'The total width of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width
    - annotation:
        type: float
      default: None
      description: "The center position of the scan in the x-direction in microns.\
        \ If not provided, \nthe current x-motor position will be used as the center.\
        \ Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the x-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x
    - annotation:
        type: float
      default: '0'
      description: 'The total height of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height
    - annotation:
        type: float
      default: None
      description: "The center position of the scan in the y-direction in microns.\
        \ If not provided, \nthe current y-motor position will be used as the center.\
        \ Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_center
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the y-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y
    - annotation:
        type: float
      default: '0'
      description: 'The dwell time per step in milliseconds. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms
    - annotation:
        type: float
      default: '0'
      description: 'The total width of the fine scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width_fine
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the x-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x_fine
    - annotation:
        type: float
      default: '0'
      description: 'The total height of the fine scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height_fine
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the y-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y_fine
    - annotation:
        type: float
      default: '0'
      description: 'The dwell time per step in milliseconds. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms_fine
    - annotation:
        type: float
      default: None
      description: "The sample z position in millimeters. If not provided, the current\
        \ sample z \nposition will be maintained. Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: sample_z
    - annotation:
        type: float
      default: None
      description: "The sample theta position in degrees. If not provided, the current\
        \ sample theta \nposition will be maintained. Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: theta
    - annotation:
        type: float
      default: None
      description: "The bda position that allows beam to pass. Unit is in millimeters.\
        \ If not provided, the current bda position \nwill be maintained. Default:\
        \ None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: bda_position
    - annotation:
        type: str
      default: ''''''
      description: 'The element to use for the fine scan center computation. Default:
        "". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: elm
    - annotation:
        type: str
      default: ''''''
      description: 'This is optional. The element to use for the fine scan center
        computation. Default: "". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: mask_elm
    - annotation:
        type: bool
      default: 'False'
      description: 'This is optional. Whether to use the mask for the fine scan center
        computation. Default: False. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: use_mask
    - annotation:
        type: float
      default: '2.0'
      description: 'This is optional. The number of standard deviations to use for
        the fine scan center computation. Default: 2.0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: n_std
    - annotation:
        type: int
      default: '2'
      description: 'The number of clusters to use for the fine scan center computation.
        Default: 2. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: n_cluster
    - annotation:
        type: int
      default: '1'
      description: 'The cluster to use for the fine scan center computation. Recommended
        value is n_cluster - 1, which is the cluster with the highest intensity. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: sel_cluster
    - annotation:
        type: bool
      default: 'False'
      description: 'Whether to use fixed y-coordinates for k-means clustering. Default:
        False.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: kmean_fixed_y
    - annotation:
        type: float
      default: '60.0'
      description: 'The timeout for waiting for the coarse scan h5 file. Default:
        60.0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: file_wait_timeout
    - annotation:
        type: bool
      default: 'True'
      description: 'Whether to enable the xmap detector. Default: True. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xmap_on
    - annotation:
        type: bool
      default: 'False'
      description: 'Whether to enable the xp3 detector. Default: False. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xp3_on
    - annotation:
        type: bool
      default: 'False'
      description: 'Whether to enable the eiger detector. Default: False. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: eiger_on
    - annotation:
        type: float
      default: '1'
      description: 'The exposure factor for the ptycho detector. Default: 1. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: ptycho_exp_factor
    - annotation:
        type: str
      default: None
      description: The machine name for DM analysis. If not provided, DM XRF processing
        is not run.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dm_analysis_machine
    - annotation:
        type: str
      default: None
      description: The DM experiment name. Required when DM submission is requested.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dm_experiment_name
    - annotation:
        type: str
      default: None
      description: 'Directory where DM writes processed files. If omitted, the default

        path is derived from savedata.'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dm_download
    properties:
      is_generator: true
