existing_plans:
  fly2d_scanrecord:
    description: '2D Bluesky plan that drives the x- and y- sample motors in flying
      mode using

      ScanRecord'
    module: s2ide_uprobe.plans.fly2d_scanrecord
    name: fly2d_scanrecord
    parameters:
    - annotation:
        type: str
      default: '''smp1'''
      description: 'Str: The name of the sample'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - annotation:
        type: str
      default: ''''''
      description: 'Str: The user comments for the scan'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - annotation:
        type: float
      default: '0'
      description: 'Float: The width of the scan in unit of mm'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width_mm
    - annotation:
        type: float
      default: None
      description: 'Float: The center of the scan in the x direction. Default is None
        which uses the current position of samx'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center_mm
    - annotation:
        type: float
      default: '0'
      description: 'Float: The step size in the x direction in unit of mm'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x_mm
    - annotation:
        type: float
      default: '0'
      description: 'Float: The height of the scan in unit of mm'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height_mm
    - annotation:
        type: float
      default: None
      description: 'Float: The center of the scan in the y direction. Default is None
        which uses the current position of samy'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_center_mm
    - annotation:
        type: float
      default: '0'
      description: 'Float: The step size in the y direction in unit of mm'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y_mm
    - annotation:
        type: float
      default: '0'
      description: 'Float: The dwell time in the scan in unit of ms'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms
    - annotation:
        type: float
      default: None
      description: 'Float: The theta of the sample'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: smp_theta
    - annotation:
        type: bool
      default: 'True'
      description: 'Bool: Whether to collect XRF data'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xrf_on
    - annotation:
        type: bool
      default: 'False'
      description: 'Bool: Whether to collect Ptycho data'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: ptycho_on
    - annotation:
        type: float
      default: '1'
      description: 'Float: The exposure factor for the Ptycho detector'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: ptycho_exp_factor
    - annotation:
        type: bool
      default: 'False'
      description: 'Bool: Whether to collect Preamp data'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: preamp_on
    - annotation:
        type: bool
      default: 'False'
      description: 'Bool: Whether to run the workflow'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: wf_run
    - annotation:
        type: str
      default: '''mona2'''
      description: 'Str: The name of the analysis machine'
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: analysisMachine
    properties:
      is_generator: true
