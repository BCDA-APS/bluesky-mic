existing_plans:
  fly2d_scanrecord:
    description: 2D Bluesky plan that drives the x- and y- sample motors in fly mode
      using ScanRecord
    module: s8bmb_uprobe.plans.fly2d_scanrecord
    name: fly2d_scanrecord
    parameters:
    - annotation:
        type: str
      default: '''smp1'''
      description: 'The name of the sample for file naming. Default: "smp1". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: samplename
    - annotation:
        type: str
      default: ''''''
      description: 'User comments to be recorded with the scan data. Default is "". '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: user_comments
    - annotation:
        type: float
      default: '0'
      description: 'The total width of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: width
    - annotation:
        type: float
      default: None
      description: "The center position of the scan in the x-direction in microns.\
        \ If not provided, \nthe current x-motor position will be used as the center.\
        \ Default: None."
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: x_center
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the x-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_x
    - annotation:
        type: float
      default: '0'
      description: 'The total height of the scan area in microns. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: height
    - annotation:
        type: float
      default: None
      description: "The center position of the scan in the y-direction in microns.\
        \ If not provided, \nthe current y-motor position will be used as the center.\
        \ Default: None. "
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: y_center
    - annotation:
        type: float
      default: '0'
      description: 'The step size (spatial resolution) in the y-direction in microns.
        Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: stepsize_y
    - annotation:
        type: float
      default: '0'
      description: 'The dwell time per step in milliseconds. Default: 0. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: dwell_ms
    - annotation:
        type: bool
      default: 'True'
      description: 'Whether to enable the sis3820 detector. Default is True. '
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: sis3820_on
    - annotation:
        type: bool
      default: 'True'
      description: Whether to enable the xp3 detector. Default is True.
      kind:
        name: POSITIONAL_OR_KEYWORD
        value: 1
      name: xp3_on
    properties:
      is_generator: true
